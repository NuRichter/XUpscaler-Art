[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "xupscaler-art"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = [
    "torch",
    "torchvision",
    "Pillow",
    "numpy",
    "requests",
    "gdown",
    "spandrel",
    "basicsr",
    "realesrgan",
    "opencv-python",
]

[project.scripts]
xupscaler = "xupscaler.cli:main"

[tool.setuptools.packages.find]
where = ["."]
